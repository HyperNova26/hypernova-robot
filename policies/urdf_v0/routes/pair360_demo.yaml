#
# PAIR360 데모 지형 위의 시연 경로. Isaac Lab, MuJoCo, Isaac Sim 재생 스크립트가 같은 파일을 읽습니다.
# 2026-11-08. 좌표는 데모 프레임(x=동, y=북, z=위, 단위 m, 원점=기존 데모 시작점)이며 docs/decisions/0003-pair360-demo-frame.md의
# 변환(원점 이동 + yaw -93.17도, 수평화 없음)을 따릅니다.
#
# 근거: 흰 선 오른쪽 아래 끝을 시작, 왼쪽 위 끝을 도착으로 보고,
# 정사영 카메라로 가정해 지면 메시 위로 역투영해 얻은 값입니다. 시작·도착 좌표는 +-3~5 m 오차로 봅니다(정확한 좌표를 알면 교체).
# 시작·도착 사이의 y -24..-8, x 63..75 구간은 지면 메시에 구멍(나무 제외 영역으로 보임)이 있어 경로 A는 북쪽으로 돌아갑니다.
frame: pair360_demo (x=East, y=North, z=up, m)
routes:
  A:
    description: 스크린샷 경로에 가깝게(183 m). 주차장 -> 폭 약 2 m의 목(x 8~9.5, y -7~-12) -> 주차장 남쪽 띠 -> 구멍을 북쪽으로 돌아 -> 도로
    start: [-6.2, 5.8]
    waypoints:
      - [-2.2, 7.8]
      - [5.8, 7.2]
      - [6.2, -3.2]
      - [8.8, -7.8]
      - [8.8, -11.8]
      - [7.8, -16.2]
      - [10.8, -17.8]
      - [59.8, -18.8]
      - [60.8, -14.2]
      - [68.2, -6.8]
      - [72.2, -6.8]
      - [77.2, -11.8]
      - [76.2, -20.2]
      - [78.2, -25.8]
      - [67.8, -74.2]
      - [66.2, -74.8]
  B:
    description: 목을 피해 구멍 덩어리를 서쪽으로 돌아감(192 m, 구멍까지 항상 2.4 m 이상)
    start: [-6.2, 5.8]
    waypoints:
      - [-9.8, -3.2]
      - [-14.2, -7.8]
      - [-14.2, -12.8]
      - [-10.2, -16.8]
      - [57.2, -18.8]
      - [66.8, -4.8]
      - [73.8, -4.8]
      - [77.2, -8.2]
      - [77.8, -27.2]
      - [66.2, -74.8]
