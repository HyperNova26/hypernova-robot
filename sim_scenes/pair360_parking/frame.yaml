source:
  dataset: PAIR360 (ODbL 1.0) — Kim et al., RA-L 2024
  url: https://airlabkhu.github.io/PAIR-360-Dataset/
  map: Traversal1/Parking_and_Open_theater/extra/T1_parking_Seq0.pcd
  map_frame: T1S0 LIO map (= first LiDAR frame of Sequence0)
demo_frame:
  convention: ENU-aligned, x=East y=North z=up, meters
  origin_in_map: [-31.9364, 110.2582, -0.4447]
  yaw_map_to_enu_deg: -93.17
T_demo_from_map_unleveled:
  - [-0.055299, 0.998470, 0.0, -111.855531]
  - [-0.998470, -0.055299, 0.0, -25.790396]
