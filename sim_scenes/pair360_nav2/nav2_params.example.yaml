# Nav2 (Jazzy) example: static map + keep-out filter on pair360_map. Paths assume this folder is mounted at /maps.
# Bring-up order matters: filter_mask_server and costmap_filter_info_server before the costmap, map_server last
# (see README). Checked with tools/map/check_nav2_keepout.sh on 2026-11-24.
map_server:
  ros__parameters:
    yaml_filename: /maps/map.yaml
    frame_id: pair360_map
filter_mask_server:
  ros__parameters:
    yaml_filename: /maps/keepout_mask.yaml
    topic_name: /keepout_filter_mask
    frame_id: pair360_map
costmap_filter_info_server:
  ros__parameters:
    type: 0                       # 0 = keep-out
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: pair360_map
      robot_base_frame: base_link
      resolution: 0.1
      track_unknown_space: true
      plugins: [static_layer, inflation_layer]
      filters: [keepout_filter]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map             # absolute; a relative "map" resolves inside the costmap namespace
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
lifecycle_manager_filters:
  ros__parameters:
    autostart: true
    node_names: [filter_mask_server, costmap_filter_info_server]
lifecycle_manager_map:
  ros__parameters:
    autostart: true
    node_names: [map_server]
